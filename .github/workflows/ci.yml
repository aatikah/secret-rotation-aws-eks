name: CI

# Runs on PRs and pushes to main. The job graph:
#   quality  -> unit tests, lint, type check, secret scan, dependency audit
#   terraform-> fmt check + validate (no AWS calls, no apply)
#   package  -> build and sanity-check the rotation Lambda zip
#   deploy-dev (manual, OIDC) -> only via workflow_dispatch, gated by an
#                                environment with required reviewers
#
# Security:
#   * No long-lived AWS keys. The deploy job uses GitHub OIDC to assume a
#     narrowly-scoped role (provisioned by terraform/modules/cicd-identity).
#   * No real secret rotation is triggered by CI. Pure-logic unit tests run on
#     every build; the AWS integration tests (RUN_AWS_INTEGRATION=1) run only in
#     the gated deploy path against a disposable environment.

on:
  # push:
  #   branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: "Deploy the dev environment (requires approval)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests lambda scripts

      - name: Mypy type check
        run: mypy

      - name: Unit tests (exclude integration)
        run: pytest -m "not integration" --cov=secrets_rotation --cov-report=term-missing

      - name: Install audit tools
        run: python -m pip install pip-audit pip-tools

      - name: Audit platform dependencies
        run: |
          pip-compile --extra dev --output-file /tmp/platform-requirements.txt pyproject.toml
          python -m pip_audit -r /tmp/platform-requirements.txt

      - name: Audit Lambda dependencies
        run: python -m pip_audit -r lambda/database_rotation/requirements.txt


      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Format check
        run: terraform fmt -check -recursive ../..

      - name: Init (no backend, no AWS)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  package:
    name: Build rotation Lambda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        run: |
          python -m pip install --upgrade pip
          python scripts/build_lambda.py --python-version 312 --arch x86_64

      - name: Sanity-check package contents
        run: |
          test -f terraform/modules/rotation-lambda/build/package/handler.py
          test -d terraform/modules/rotation-lambda/build/package/secrets_rotation
          # psycopg must be vendored for the Lambda platform.
          ls terraform/modules/rotation-lambda/build/package | grep -i psycopg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotation-lambda-package
          path: terraform/modules/rotation-lambda/build/package
          retention-days: 5

  deploy-dev:
    name: Deploy dev (manual, OIDC)
    needs: [quality, terraform, package]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_dev
    runs-on: ubuntu-latest
    # The 'dev' environment should require reviewers / protection rules in repo
    # settings. Production would use a separate, more restricted environment.
    environment: dev
    permissions:
      contents: read
      id-token: write # required for OIDC
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      # - name: Check deployment context
      #   run: |
      #     echo "Repository: $GITHUB_REPOSITORY"
      #     echo "Branch/ref: $GITHUB_REF"
      #     echo "Event: $GITHUB_EVENT_NAME"
      #     echo "Expected environment: dev"

      # - name: Debug actual OIDC claims
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const token = await core.getIDToken('sts.amazonaws.com');
      #       const claims = JSON.parse(
      #         Buffer.from(token.split('.')[1], 'base64url').toString()
      #       );
      #       core.info(`OIDC subject: ${claims.sub}`);
      #       core.info(`OIDC audience: ${JSON.stringify(claims.aud)}`);


      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        run: python scripts/build_lambda.py --python-version 312 --arch x86_64
        working-directory: .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan
