[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secrets-rotation-platform"
version = "0.1.0"
description = "Enterprise secrets management and automated rotation platform (AWS Secrets Manager + Python + Kubernetes + CI/CD)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DevSecOps Portfolio" }]

# Runtime dependencies are pinned to compatible ranges verified against the
# current stable releases (October 2026). boto3/botocore track the AWS SDK;
# psycopg[binary] is the maintained PostgreSQL driver (v3).
dependencies = [
    "boto3>=1.35,<2.0",
    "botocore>=1.35,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "cryptography>=50.0.0,<51.0.0",
    "PyYAML>=6.0,<7.0",
    "click>=8.1,<9.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0,<7.0",
    "boto3-stubs[secretsmanager,cloudtrail,cloudwatch]>=1.35,<2.0",
]

[project.scripts]
secrets-rotation = "secrets_rotation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that run against a real, deployed AWS environment (require RUN_AWS_INTEGRATION=1 and AWS credentials; deselect with -m 'not integration').",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
# S101 (assert) is fine in tests; allow it there via per-file ignores.
ignore = ["S311"]  # S311: non-crypto RNG — we gate real randomness with secrets module explicitly.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
packages = ["secrets_rotation"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true
