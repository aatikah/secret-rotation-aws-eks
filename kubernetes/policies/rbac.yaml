# Least-privilege RBAC for the application.
#
# The app's service account may read ONLY its own synced Secret (by name) in its
# own namespace — not all Secrets. This limits blast radius if the pod is
# compromised. ESO itself runs with its own (separate) permissions installed by
# its Helm chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: myapp-secret-reader
  namespace: myapp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["myapp-database"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myapp-secret-reader
  namespace: myapp
subjects:
  - kind: ServiceAccount
    name: myapp-secrets
    namespace: myapp
roleRef:
  kind: Role
  name: myapp-secret-reader
  apiGroup: rbac.authorization.k8s.io
