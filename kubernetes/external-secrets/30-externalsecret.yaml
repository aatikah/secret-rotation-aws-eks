# ExternalSecret: declares which AWS secret to sync into which Kubernetes
# Secret, and how often to refresh.
#
# refreshInterval controls how often ESO re-reads Secrets Manager and updates
# the Kubernetes Secret. After a rotation promotes a new AWSCURRENT, the K8s
# Secret is refreshed within this interval. NOTE: refreshing the Secret object
# does NOT reload an already-running process — see the sample app's reloader
# sidecar / restart strategy in kubernetes/sample-app/.
#
# This syncs the application database secret. The JSON fields in Secrets Manager
# are mapped to individual keys in the resulting Kubernetes Secret so the app
# can consume DB_USERNAME / DB_PASSWORD etc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myapp-database
  namespace: myapp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    # The Kubernetes Secret ESO will create/own. It is managed by ESO; do NOT
    # commit a populated version of this Secret to git.
    name: myapp-database
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          # Changing this annotation on refresh can trigger a reloader to
          # restart consuming pods (see sample-app). ESO stamps the data hash.
          secrets-rotation.io/managed-by: external-secrets
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: dev/myapp/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: dev/myapp/database
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: dev/myapp/database
        property: host
    - secretKey: DB_NAME
      remoteRef:
        key: dev/myapp/database
        property: dbname
