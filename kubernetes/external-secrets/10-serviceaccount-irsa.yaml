# Service account the application pods (and ESO, when using per-SA auth) assume
# to reach AWS Secrets Manager via IRSA / EKS Pod Identity.
#
# On EKS: annotate this SA with the IAM role ARN that has least-privilege
# read access to ONLY the dev/myapp/* secrets. The role's trust policy binds it
# to this namespace + service account (OIDC subject), so no AWS keys live in the
# cluster.
#
# Replace <ACCOUNT_ID> and the role name with your Terraform-provisioned role
# (a dedicated module can emit this; see docs/kubernetes.md). This file is a
# template: it contains NO credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-secrets
  namespace: myapp
  annotations:
    # EKS IRSA: the IAM role to assume. Least-privilege: read dev/myapp/* only.
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/dev-myapp-eso-reader
  labels:
    app.kubernetes.io/part-of: secrets-rotation-platform
