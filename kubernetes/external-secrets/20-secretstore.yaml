# SecretStore: how ESO reaches AWS Secrets Manager for the myapp namespace.
#
# Auth uses the pod's IRSA identity via `jwt` + the service account, so NO AWS
# access keys are stored in the cluster. This is the least-privilege, workload-
# identity approach the project prefers over static credentials.
#
# A namespaced SecretStore (vs ClusterSecretStore) keeps this binding scoped to
# the myapp namespace — the application cannot read other namespaces' stores.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: myapp
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Use the mounted service-account token (IRSA / Pod Identity). The SA's
        # annotated IAM role is assumed; it is scoped to dev/myapp/* secrets.
        jwt:
          serviceAccountRef:
            name: myapp-secrets
